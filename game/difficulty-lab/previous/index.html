<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ead5b8"><title>DOTIRO · 难度试绣</title><link rel="stylesheet" href="lab.css"></head><body><main><header><img src="../../assets/logo-transparent.png" alt="哆来绣 DOTIRO"><span>难度试绣</span></header><nav id="levels" aria-label="选择小样"></nav><section class="heading"><h1 id="title"></h1><span id="tag"></span></section><p id="brief"></p><div class="progress"><span id="count"></span><span id="stats"></span></div><div class="board-tools"><button id="mode" aria-pressed="false">移动棋盘</button><span id="scale"></span></div><div id="viewport" tabindex="0" aria-label="连线棋盘，可使用方向键"><div id="board"><div id="cells"></div><svg id="route" aria-hidden="true"><polyline id="thread"></polyline><polyline id="fiber"></polyline></svg></div></div><p id="message" role="status"></p><div class="actions"><button id="undo">退一针</button><button id="restart">重来</button><button id="hint">提示</button><button id="next">下一样</button></div><details><summary>玩法与大棋盘操作</summary><p>从标记格出发，上下左右连接。同一种图案必须全部连完，才能换下一种。不能重复经过格子，缝布障碍不能进入。连完所有图案格即完成。</p><p>可以点按相邻格，也可以拖动连线。点已走格可退回该位置。大棋盘放不下时，先点“移动棋盘”再拖动查看；点“继续连线”恢复操作。方向键连接，退格键撤回。</p></details><section class="feedback"><span>这一样感觉如何？</span><div id="ratings"><button data-rating="轻松">轻松</button><button data-rating="刚好">刚好</button><button data-rating="太难">太难</button><button data-rating="容易误触">容易误触</button></div><p id="rating-note"></p></section><footer>小样进度单独保存 · 大关作品沿用原定稿</footer></main><script src="levels.js"></script><script src="lab.js"></script></body></html>
